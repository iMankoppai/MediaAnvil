name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qt.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements-qt.txt

      - name: Prepare verified FFmpeg binaries
        shell: powershell
        run: ./tools/download_ffmpeg.ps1

      - name: Compile Python sources
        run: python -m compileall -q core sub2lrc mediaanvil_qt tests tools main_qt.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v

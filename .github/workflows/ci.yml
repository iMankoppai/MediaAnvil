name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Prepare verified FFmpeg binaries
        shell: powershell
        run: ./tools/download_ffmpeg.ps1

      - name: Compile Python sources
        run: python -m compileall -q core sub2lrc mediaanvil_qt tests tools main_qt.py

      - name: Verify documented build commands
        run: python tools/verify_document_commands.py

      - name: Run test suite
        shell: pwsh
        run: |
          # Use canonical TEMP paths even when Windows exposes an 8.3 alias.
          $taskTempPath = python -c 'import tempfile; from pathlib import Path; print(Path(tempfile.gettempdir()).resolve())'
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the test temp directory.' }
          $env:TEMP = $taskTempPath
          $env:TMP = $taskTempPath
          python -m unittest discover -s tests -v

name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Create isolated build environment
        shell: powershell
        run: |
          python -m venv .build-venv-windows
          .build-venv-windows\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Build and verify Windows application
        shell: powershell
        run: ./build-qt.ps1

      - name: Run full test suite
        shell: powershell
        run: |
          $env:SUB2LRC_TEST_FFMPEG = (Resolve-Path vendor/ffmpeg/ffmpeg.exe).Path
          .build-venv-windows\Scripts\python.exe -m unittest discover -s tests -v

      - name: Package release and checksum
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $archive = "release/MediaAnvil-$env:RELEASE_TAG-Windows-x64.zip"
          Compress-Archive -Path dist/MediaAnvilQt -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $([IO.Path]::GetFileName($archive))" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MediaAnvil-${{ env.RELEASE_TAG }}-Windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath release -File | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --verify-tag --generate-notes --title "MediaAnvil $env:RELEASE_TAG"
          }

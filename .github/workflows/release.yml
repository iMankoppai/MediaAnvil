name: MediaAnvil Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      MEDIAANVIL_KEYSTORE_PATH: ${{ github.workspace }}/android/mediaanvil-release.jks
      MEDIAANVIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEDIAANVIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MEDIAANVIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MEDIAANVIL_KEYSTORE_PATH"

      - name: Test and build signed Android APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Package Android APK and checksum
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/MediaAnvil-$RELEASE_TAG-Android.apk"
          cd release-android
          sha256sum *.apk > "MediaAnvil-$RELEASE_TAG-Android.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaAnvil-Android-release
          path: release-android/*
          if-no-files-found: error

  build-and-publish:
    needs: build-android
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/download-artifact@v4
        with:
          name: MediaAnvil-Android-release
          path: release

      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .build-venv-windows
          .build-venv-windows\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Build and verify Windows application
        shell: pwsh
        run: ./build-qt.ps1

      - name: Run full test suite
        shell: pwsh
        run: |
          $env:SUB2LRC_TEST_FFMPEG = (Resolve-Path vendor/ffmpeg/ffmpeg.exe).Path
          .build-venv-windows\Scripts\python.exe -m unittest discover -s tests -v

      - name: Package release and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $archive = "release/MediaAnvil-$env:RELEASE_TAG-Windows-x64.zip"
          Compress-Archive -Path dist/MediaAnvilQt -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $([IO.Path]::GetFileName($archive))" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MediaAnvil-${{ env.RELEASE_TAG }}-Windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath release -File | ForEach-Object FullName
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($releases.tagName -contains $env:RELEASE_TAG) {
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --verify-tag --generate-notes --title "MediaAnvil $env:RELEASE_TAG"
          }

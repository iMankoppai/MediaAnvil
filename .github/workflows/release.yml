name: MediaAnvil Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .build-venv-windows
          .build-venv-windows\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Build and verify Windows application
        shell: pwsh
        run: ./build-qt.ps1

      - name: Run full test suite
        shell: pwsh
        run: |
          $env:SUB2LRC_TEST_FFMPEG = (Resolve-Path vendor/ffmpeg/ffmpeg.exe).Path
          .build-venv-windows\Scripts\python.exe -m unittest discover -s tests -v

      - name: Package release and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $archive = "release/MediaAnvil-$env:RELEASE_TAG-Windows-x64.zip"
          Compress-Archive -Path dist/MediaAnvilQt -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $([IO.Path]::GetFileName($archive))" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MediaAnvil-${{ env.RELEASE_TAG }}-Windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        run: |
          # GitHub can create an empty release by itself the moment an annotated
          # tag is pushed, so by the time this step runs the tag often already has
          # a release with no assets. That is why the branch below exists, and why
          # every gh call is checked: a release that exists with no files looks
          # completely successful from the outside, which is exactly how v1.3.0
          # shipped with an empty download list.
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          if ($files.Count -lt 2) { throw "Expected a package and its checksum in release/, found $($files.Count)." }
          $notes = "release/notes.md"
          python tools/release_notes.py $env:RELEASE_TAG $notes
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no entry for $env:RELEASE_TAG" }
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases." }
          if ($releases.tagName -contains $env:RELEASE_TAG) {
            gh release upload $env:RELEASE_TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading assets to $env:RELEASE_TAG failed." }
            gh release edit $env:RELEASE_TAG --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Updating the notes for $env:RELEASE_TAG failed." }
          } else {
            gh release create $env:RELEASE_TAG @files --verify-tag --notes-file $notes --title "MediaAnvil Windows $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Creating the release $env:RELEASE_TAG failed." }
          }
          # Read the assets back from the API rather than trusting the commands
          # above: this is the check that would have caught the empty v1.3.0.
          # The release is looked up by id and its assets fetched from the
          # dedicated endpoint on purpose. `releases/tags/<tag>` and
          # `gh release view --json assets` both report an empty asset list for a
          # release that definitely has files, so either would fail this check
          # spuriously and block a good release.
          $releaseId = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" --jq '.id'
          if ($LASTEXITCODE -ne 0) { throw "Could not read back the release for $env:RELEASE_TAG." }
          $published = gh api "repos/${{ github.repository }}/releases/$releaseId/assets" --jq 'length'
          if ($LASTEXITCODE -ne 0) { throw "Could not read back the assets for $env:RELEASE_TAG." }
          if ([int]$published -lt 2) { throw "$env:RELEASE_TAG has $published assets after publishing; expected the package and its checksum." }
          Write-Host "Published $env:RELEASE_TAG with $published assets."
